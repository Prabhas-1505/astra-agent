services:
  r1:
    build: ./fake_router
    environment:
      - ROUTER_NAME=R1
      - FAULT_SCENARIO=${FAULT_SCENARIO:-gi_shutdown}
      # Lab-fixture credential, now an explicit compose-level default instead
      # of a hardcoded fallback buried in Python source (see netmiko_tool.py).
      - ROUTER_USER=${ROUTER_USER:-netops}
      - ROUTER_PASS=${ROUTER_PASS:-C1sco123!}
    ports:
      - "2201:8022"
    networks:
      - labnet

  r2:
    build: ./fake_router
    environment:
      - ROUTER_NAME=R2
      - FAULT_SCENARIO=${FAULT_SCENARIO:-gi_shutdown}
      - ROUTER_USER=${ROUTER_USER:-netops}
      - ROUTER_PASS=${ROUTER_PASS:-C1sco123!}
    ports:
      - "2202:8022"
    networks:
      - labnet

networks:
  labnet:
    driver: bridge
